name: Notify IndexNow

on:
  workflow_run:
    # GitHub's managed Pages workflow name and its run display name.
    workflows: ["pages-build-deployment", "pages build and deployment"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      full:
        description: "Notify all sitemap URLs after verifying this commit is deployed"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Notify URLs from the deployed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PAGES_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id || '369909132' }}
          INDEXNOW_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python3 -B scripts/notify_indexnow.py
